<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Storage - Member</title>
</head>
<body>
    <center>
        <h1>Selamat Datang, Member!</h1>
        <button onclick="gantiNama(event)">Masukkan Nama</button>
        <button onclick="hapusNama(event)">Hapus Nama Member</button>
    </center>

    <script type="text/javascript">
        const namaMember = document.querySelector('h1');

        // Memeriksa apakah ada nama tersimpan di localStorage saat halaman dibuka
        const namaTersimpan = localStorage.getItem('nama');
        if (namaTersimpan) {
            namaMember.innerHTML = 'Halo ' + namaTersimpan + '!';
        }

        // Fungsi menyimpan/mengubah nama
        function gantiNama(e) {
            let nama = prompt('Masukkan nama Anda:');
            if (nama && nama.trim() !== "") {
                localStorage.setItem('nama', nama);
                namaMember.innerHTML = 'Halo ' + nama + '!';
            } else {
                alert('Nama tidak boleh kosong!');
            }
            if (e) e.preventDefault();
        }

        // Fungsi menghapus nama member dari localStorage
        function hapusNama(e) {
            localStorage.removeItem('nama');
            namaMember.innerHTML = 'Selamat Datang, Member!';
            alert('Nama member berhasil dihapus!');
            if (e) e.preventDefault();
        }
    </script>
</body>
</html>
